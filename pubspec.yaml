name: garagem_central
description: "Garagem Central - monitoramento de vagas (VagaVision)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  firebase_core: ^4.0.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.0.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/imagem_estacionamento_2.svg
    - google_fonts/
